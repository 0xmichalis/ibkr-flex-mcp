name: Security Audit

# `cargo audit` on a schedule rather than in CI: advisories are published against
# code that has not changed, so a vulnerability is news about the world, not about
# the commit. Running it here keeps unrelated pull requests green while still
# surfacing a finding within a day — as a GitHub issue rather than a red X on
# somebody else's work.
#
# Exclusions are read from `[advisories] ignore` in deny.toml, so an accepted risk
# is recorded in exactly one place.

on:
  schedule:
    - cron: "17 6 * * *" # daily, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  CARGO_TERM_COLOR: never
  CARGO_AUDIT_VERSION: "0.22.0"
  ISSUE_TITLE: "cargo audit: vulnerable dependencies"

jobs:
  audit:
    name: Cargo Audit
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      run: |
        rustup show active-toolchain || rustup toolchain install
        rustup show

    - name: Cache cargo-audit binary
      id: cache-cargo-audit
      uses: actions/cache@v4
      with:
        path: ${{ runner.tool_cache }}/cargo-audit
        key: cargo-audit-bin-${{ env.CARGO_AUDIT_VERSION }}

    - name: Add cargo-audit to PATH
      run: echo "${{ runner.tool_cache }}/cargo-audit/bin" >> "$GITHUB_PATH"

    - name: Install cargo-audit
      if: steps.cache-cargo-audit.outputs.cache-hit != 'true'
      run: cargo install --root "${{ runner.tool_cache }}/cargo-audit" --version ${{ env.CARGO_AUDIT_VERSION }} --locked cargo-audit

    # deny.toml is the single source of truth for accepted advisories. Entries may
    # be bare ids or { id, reason } tables; both map to `--ignore <id>`.
    - name: Read exclusions from deny.toml
      id: exclusions
      run: |
        set -euo pipefail
        FLAGS=$(python3 - <<'PY'
        try:
            import tomllib
        except ModuleNotFoundError:  # Python < 3.11
            import tomli as tomllib
        with open("deny.toml", "rb") as f:
            cfg = tomllib.load(f)
        ignores = cfg.get("advisories", {}).get("ignore", [])
        ids = [i["id"] if isinstance(i, dict) else i for i in ignores]
        print(" ".join(f"--ignore {i}" for i in ids))
        PY
        )
        echo "Ignoring: ${FLAGS:-(none)}"
        echo "flags=$FLAGS" >> "$GITHUB_OUTPUT"

    # `if` rather than a bare command: steps run under `bash -e`, and a failing
    # audit must not abort the step, or the reporting steps below get skipped.
    - name: Run cargo audit
      id: audit
      run: |
        set -uo pipefail
        if cargo audit ${{ steps.exclusions.outputs.flags }} 2>&1 | tee audit.log; then
          echo "exit_code=0" >> "$GITHUB_OUTPUT"
        else
          echo "exit_code=1" >> "$GITHUB_OUTPUT"
        fi

    # One rolling issue, reused across runs: a daily cron that opens a fresh issue
    # every morning trains you to ignore it.
    - name: Open or update issue on findings
      if: steps.audit.outputs.exit_code != '0'
      env:
        GH_TOKEN: ${{ github.token }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        set -euo pipefail

        {
          echo "\`cargo audit\` found vulnerable dependencies on \`${GITHUB_SHA::7}\`."
          echo
          echo "\`\`\`"
          cat audit.log
          echo "\`\`\`"
          echo
          echo "[Workflow run]($RUN_URL)"
          echo
          echo "_Exclusions are configured in \`[advisories] ignore\` in deny.toml._"
        } > issue-body.md

        EXISTING=$(gh issue list --state open --search "\"$ISSUE_TITLE\" in:title" \
          --json number,title --jq "[.[] | select(.title == \"$ISSUE_TITLE\")][0].number // empty")

        if [[ -n "$EXISTING" ]]; then
          echo "Updating issue #$EXISTING"
          gh issue edit "$EXISTING" --body-file issue-body.md
          gh issue comment "$EXISTING" --body "Still failing as of $RUN_URL"
        else
          echo "Opening a new issue"
          gh issue create --title "$ISSUE_TITLE" --body-file issue-body.md
        fi

    - name: Close the issue when clean
      if: steps.audit.outputs.exit_code == '0'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        EXISTING=$(gh issue list --state open --search "\"$ISSUE_TITLE\" in:title" \
          --json number,title --jq "[.[] | select(.title == \"$ISSUE_TITLE\")][0].number // empty")
        if [[ -n "$EXISTING" ]]; then
          gh issue close "$EXISTING" --comment "No advisories reported by \`cargo audit\` on \`${GITHUB_SHA::7}\`."
        fi

    - name: Fail the run when advisories were found
      if: steps.audit.outputs.exit_code != '0'
      run: exit 1
