name: Release

# Publish a GitHub Release with prebuilt binaries when a version tag is pushed:
#   git tag v0.1.0 && git push origin v0.1.0
#
# Linux is built for musl, so the binary is statically linked (no libc dependency)
# and runs on any x86_64 Linux regardless of the host's glibc version. macOS is
# built for both architectures; Apple does not support static libc linking, but
# the binaries need nothing beyond the system libraries every Mac has.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release (e.g. v0.1.0)"
        required: true

# Least privilege: only the job that publishes needs write. The build jobs run
# dependency build scripts, so they get a read-only token and, below, a checkout
# that does not leave it in .git/config.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Resolved once. On workflow_dispatch github.ref_name is the branch the
  # workflow was dispatched from ("main"), not the tag being released.
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            builder: cross
          # Apple Silicon: native on the arm64 runner.
          - target: aarch64-apple-darwin
            os: macos-latest
            builder: cargo
          # Intel Macs: cross-compiled from the same arm64 runner. Apple's
          # toolchain targets both architectures, so no container is needed.
          - target: x86_64-apple-darwin
            os: macos-latest
            builder: cargo
          # aarch64-unknown-linux-musl can be added here later (cross handles it).

    steps:
    # A tag name may legally contain shell metacharacters, and it reaches several
    # `run:` scripts below. Reject anything that is not a plain version tag before
    # it is used, and pass it through env rather than `${{ }}` interpolation.
    - name: Validate release tag
      run: |
        if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
          echo "refusing to release a tag that is not vMAJOR.MINOR.PATCH: $RELEASE_TAG" >&2
          exit 1
        fi

    # On a tag push this is the tag; on workflow_dispatch it must be stated
    # explicitly, or checkout would silently build the default branch and
    # publish it under the tag's name.
    #
    # persist-credentials: false keeps the token out of .git/config — cargo runs
    # dependency build scripts, which would otherwise be able to read it.
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ env.RELEASE_TAG }}
        persist-credentials: false

    - name: Install Rust
      env:
        TARGET: ${{ matrix.target }}
      run: |
        rustup show active-toolchain || rustup toolchain install
        rustup target add "$TARGET"
        rustup show

    # `cross` builds the musl target inside a container with the full toolchain
    # (C compiler + cmake) that aws-lc-rs / reqwest's TLS stack needs. The Apple
    # targets build with plain cargo against the runner's Xcode toolchain.
    - name: Install cross
      if: matrix.builder == 'cross'
      uses: taiki-e/install-action@6a1bd70eaac3c8bdf093356838d7ee09fda951cf # v2.85.5
      with:
        tool: cross

    - name: Build binary
      env:
        BUILDER: ${{ matrix.builder }}
        TARGET: ${{ matrix.target }}
      run: |
        "$BUILDER" build --release --locked --target "$TARGET"

    - name: Package
      env:
        TARGET: ${{ matrix.target }}
      run: |
        staging="ibkr-flex-mcp-${RELEASE_TAG}-${TARGET}"
        mkdir -p "$staging"
        cp "target/${TARGET}/release/ibkr-flex-mcp" "$staging/"
        cp README.md LICENSE "$staging/"
        tar czf "${staging}.tar.gz" "$staging"
        # macOS ships shasum rather than GNU coreutils' sha256sum.
        if command -v sha256sum >/dev/null 2>&1; then
          sha256sum "${staging}.tar.gz" > "${staging}.tar.gz.sha256"
        else
          shasum -a 256 "${staging}.tar.gz" > "${staging}.tar.gz.sha256"
        fi

    - name: Upload build artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ matrix.target }}
        path: |
          ibkr-flex-mcp-*.tar.gz
          ibkr-flex-mcp-*.tar.gz.sha256
        if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload assets
    steps:
    - name: Download all build artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        path: artifacts
        merge-multiple: true

    - name: Create GitHub Release
      uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
      with:
        tag_name: ${{ env.RELEASE_TAG }}
        draft: false
        generate_release_notes: true
        files: |
          artifacts/ibkr-flex-mcp-*.tar.gz
          artifacts/ibkr-flex-mcp-*.tar.gz.sha256
