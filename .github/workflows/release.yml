name: Release

# Publish a GitHub Release with prebuilt binaries when a version tag is pushed:
#   git tag v0.1.0 && git push origin v0.1.0
#
# Linux is built for musl, so the binary is statically linked (no libc dependency)
# and runs on any x86_64 Linux regardless of the host's glibc version. macOS is
# built for both architectures; Apple does not support static libc linking, but
# the binaries need nothing beyond the system libraries every Mac has.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release (e.g. v0.1.0)"
        required: true

permissions:
  contents: write # required to create the release and upload assets

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            builder: cross
          # Apple Silicon: native on the arm64 runner.
          - target: aarch64-apple-darwin
            os: macos-latest
            builder: cargo
          # Intel Macs: cross-compiled from the same arm64 runner. Apple's
          # toolchain targets both architectures, so no container is needed.
          - target: x86_64-apple-darwin
            os: macos-latest
            builder: cargo
          # aarch64-unknown-linux-musl can be added here later (cross handles it).

    steps:
    # On a tag push this is the tag; on workflow_dispatch it must be stated
    # explicitly, or checkout would silently build the default branch and
    # publish it under the tag's name.
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.inputs.tag || github.ref_name }}

    - name: Install Rust
      run: |
        rustup show active-toolchain || rustup toolchain install
        rustup target add ${{ matrix.target }}
        rustup show

    # `cross` builds the musl target inside a container with the full toolchain
    # (C compiler + cmake) that aws-lc-rs / reqwest's TLS stack needs. The Apple
    # targets build with plain cargo against the runner's Xcode toolchain.
    - name: Install cross
      if: matrix.builder == 'cross'
      uses: taiki-e/install-action@v2
      with:
        tool: cross

    - name: Build binary
      run: ${{ matrix.builder }} build --release --locked --target ${{ matrix.target }}

    - name: Package
      run: |
        # The input wins: on workflow_dispatch GITHUB_REF_NAME is the branch the
        # workflow was dispatched from ("main"), not the tag being released.
        version="${{ github.event.inputs.tag || github.ref_name }}"
        staging="ibkr-flex-mcp-${version}-${{ matrix.target }}"
        mkdir -p "$staging"
        cp "target/${{ matrix.target }}/release/ibkr-flex-mcp" "$staging/"
        cp README.md LICENSE "$staging/"
        tar czf "${staging}.tar.gz" "$staging"
        # macOS ships shasum rather than GNU coreutils' sha256sum.
        if command -v sha256sum >/dev/null 2>&1; then
          sha256sum "${staging}.tar.gz" > "${staging}.tar.gz.sha256"
        else
          shasum -a 256 "${staging}.tar.gz" > "${staging}.tar.gz.sha256"
        fi

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.target }}
        path: |
          ibkr-flex-mcp-*.tar.gz
          ibkr-flex-mcp-*.tar.gz.sha256
        if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Download all build artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
        merge-multiple: true

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event.inputs.tag || github.ref_name }}
        draft: false
        generate_release_notes: true
        files: |
          artifacts/ibkr-flex-mcp-*.tar.gz
          artifacts/ibkr-flex-mcp-*.tar.gz.sha256
