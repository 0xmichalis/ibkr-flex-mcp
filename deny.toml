# cargo-deny configuration.
#
# Advisory *scanning* is owned by the scheduled `cargo audit` workflow
# (.github/workflows/security-audit.yml), so `cargo deny check` does not run it.
# Advisory *exclusions* live here regardless: the audit workflow reads the
# `[advisories] ignore` list below and passes it to `cargo audit --ignore`, so
# there is one place to record an accepted risk.
#
# cargo-deny otherwise covers what audit cannot: license policy, banned/duplicate
# crates, and allowed sources.

[graph]
all-features = true

[advisories]
# Advisories to accept, with a reason. Both forms cargo-deny accepts work:
#   ignore = ["RUSTSEC-0000-0000"]
#   ignore = [{ id = "RUSTSEC-0000-0000", reason = "why this is not exploitable here" }]
# Prefer the second — an unexplained exclusion is indistinguishable from an
# oversight six months later.
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "0BSD",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "MPL-2.0",
]
confidence-threshold = 0.8
private = { ignore = true }

[bans]
# Transitive crates appear at multiple versions; flag, don't fail.
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
